name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Validar versão
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"

          for VERSION in "$PACKAGE_VERSION" "$TAURI_VERSION" "$CARGO_VERSION"; do
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "Versão inconsistente: tag=${TAG_VERSION}, arquivo=${VERSION}"
              exit 1
            fi
          done

      - name: Criar ou publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID="$(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" \
              | head -n 1
          )"

          if [[ -z "${RELEASE_ID}" ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Pingo ${GITHUB_REF_NAME}"
          else
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -f make_latest=true \
              >/dev/null
          fi
